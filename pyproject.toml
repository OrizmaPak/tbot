[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-burst-trading-system"
version = "0.2.0"
description = "Local MT5 market research and burst trading simulation."
requires-python = ">=3.11"
dependencies = [
  "MetaTrader5>=5.0",
  "pandas>=2.2",
  "streamlit>=1.38",
  "pyarrow>=18",
  "lightgbm>=4.5",
  "scikit-learn>=1.6",
  "joblib>=1.4",
  "psutil>=6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
